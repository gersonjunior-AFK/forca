<!-- Ilustrações de forcas para o fundo — Feito por José Victor -->
<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320" fill="none">
  <style>
    .dancer {
      transform-box: view-box;
      animation: dance 1.8s ease-in-out infinite;
    }

    .dancer--second {
      animation-delay: -0.9s;
    }

    @keyframes dance {
      0%, 100% { transform: rotate(-7deg); }
      50% { transform: rotate(7deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .dancer { animation: none; }
    }
  </style>
  <g stroke="#d8ceff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" opacity=".24">
    <path d="M43 213h72M57 213V91h53M57 108h53M105 108v20"/>
    <g class="dancer" style="transform-origin: 105px 128px">
      <circle cx="105" cy="139" r="11"/>
      <path d="M105 150v35m0-23-15 17m15-17 15 17m-15 11-13 18m13-18 13 18"/>
    </g>
    <path d="M202 271h73M216 271V149h53M216 166h53M264 166v20"/>
    <g class="dancer dancer--second" style="transform-origin: 264px 186px">
      <circle cx="264" cy="197" r="11"/>
      <path d="M264 208v35m0-23-15 17m15-17 15 17m-15 11-13 18m13-18 13 18"/>
    </g>
  </g>
</svg>
